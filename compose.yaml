x-node: &node
  image: ghcr.io/revoltify/valkey:latest
  network_mode: host
  restart: unless-stopped
  env_file: .env
  logging:
    driver: json-file
    options:
      max-size: 50m
      max-file: "5"

services:
  valkey:
    <<: *node
    volumes:
      - ./data:/data
    stop_grace_period: 30s
    ulimits:
      nofile: 65535

  probe:
    <<: *node
    entrypoint: [/sbin/tini, --, primary-probe]
    healthcheck:
      disable: true

  proxy:
    <<: *node
    entrypoint: [/sbin/tini, --, tls-proxy]
    volumes:
      - ./tls:/tls:ro
      - ./acme:/acme
    ulimits:
      nofile: 65535
    healthcheck:
      disable: true

  sentinel:
    <<: *node
    profiles: [ha]
    entrypoint: [/sbin/tini, --, sentinel-entrypoint]
    volumes:
      - ./sentinel:/data
    healthcheck:
      test: [CMD, healthcheck, "26379"]
      interval: 15s
      timeout: 5s
      retries: 3
